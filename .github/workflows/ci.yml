name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          uv venv .venv
          uv pip install --python .venv/bin/python -e ".[dev,api]"
      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/mypy src
      - name: Test
        run: .venv/bin/pytest -q --ignore=tests/test_eval_gate.py
      - name: Evaluation gate (FICTIONAL fixture corpus, hit@6 >= 85%)
        run: .venv/bin/pytest -q tests/test_eval_gate.py

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t reglens-api .
      - name: Image runs as a non-root user
        run: test "$(docker run --rm reglens-api id -u)" = "10001"
      - name: Image starts (no index yet) - /health ok, web page served, /ready reports 503
        run: |
          docker run -d --name api -p 8000:8000 -e REGLENS_EMBEDDING_MODEL=hash \
            -e REGLENS_WARM_ON_START=false reglens-api
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
          curl -sf http://localhost:8000/health || { docker logs api; exit 1; }
          curl -sf http://localhost:8000/ | grep -q "RegLens Maroc"
          curl -sf http://localhost:8000/static/app.js >/dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/ready)" = "503"
