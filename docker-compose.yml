# API (with the web page at http://localhost:8000) + Qdrant.
#   docker compose up -d
#   docker compose run --rm api reglens ingest /data/raw      # index the documents once
# Settings and keys come from .env (REGLENS_EMBEDDING_API_KEY, REGLENS_LLM_API_KEY,
# REGLENS_API_KEYS, REGLENS_ADMIN_API_KEYS, model names, chunking). With API keys set, also set
# REGLENS_PUBLIC_QUERIES=true so the web page (which holds no key) can ask questions.

services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build:
      context: .
      args:
        EXTRAS: api,llm
    env_file: .env
    environment:
      REGLENS_QDRANT_URL: http://qdrant:6333
    volumes:
      - ./data/raw:/data/raw
    ports:
      - "8000:8000"
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_storage:
