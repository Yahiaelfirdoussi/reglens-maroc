[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "reglens"
version = "0.1.0"
description = "Multilingual RAG assistant for Moroccan financial regulation (BAM, AMMC, ACAPS)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Yahya Elfirdoussi" }]
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "qdrant-client>=1.10",
    "httpx>=0.27",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]
llm = ["litellm>=1.40"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "prometheus-client>=0.20"]
ui = ["streamlit>=1.36"]

[project.scripts]
reglens = "reglens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/reglens"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# French typography is intentional in this corpus (apostrophes, dashes, guillemets).
allowed-confusables = ["’", "‘", "–", "—", "«", "»"]

[tool.ruff.lint.per-file-ignores]
# Multilingual regex patterns: long by nature, and Arabic letters are intentional.
"src/reglens/guardrails.py" = ["E501", "RUF001"]
"src/reglens/evaluation/answers.py" = ["RUF001", "RUF002"]  # Arabic-Indic digits on purpose
"tests/test_answers.py" = ["RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["fitz", "fitz.*", "litellm", "litellm.*"]
ignore_missing_imports = true

# PyMuPDF ships partial, inconsistent annotations; treat it as untyped.
[[tool.mypy.overrides]]
module = ["pymupdf", "pymupdf.*"]
follow_imports = "skip"
follow_imports_for_stubs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Emitted by PyMuPDF's SWIG bindings, not our code.
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__:DeprecationWarning",
]
